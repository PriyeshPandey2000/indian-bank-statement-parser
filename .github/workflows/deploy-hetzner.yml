name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /opt/open-parsed

            git pull origin main

            cd backend
            npm ci
            npm run build
            npm prune --omit=dev
            cd ..

            pm2 restart open-parsed-backend
            pm2 save

            # Ensure 7-day cleanup cron exists (idempotent)
            CRON_JOB="0 2 * * * find /opt/open-parsed/storage -maxdepth 1 -mindepth 1 -type d -ctime +7 -exec rm -rf {} +"
            ( crontab -l 2>/dev/null | grep -qF "$CRON_JOB" ) || ( crontab -l 2>/dev/null; echo "$CRON_JOB" ) | crontab -
